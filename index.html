<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicBridge AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            color: #6b7280;
            max-width: 650px;
            margin: auto;
            line-height: 1.6;
        }

        .buttons {
            margin-top: 35px;
        }

        button {
            padding: 14px 24px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: white;
            border: 1px solid #d1d5db;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CivicBridge AI</div>
        <div>Chandigarh Civic Intelligence</div>
    </header>

    <section class="hero">

        <h1>From Complaint to Civic Intelligence.</h1>

        <p>
            Report civic issues and let AI understand, prioritize,
            organize and transform citizen complaints into actionable insights.
        </p>

        <div class="buttons">
            <button class="primary">Report an Issue</button>
            <button class="secondary">View Civic Dashboard</button>
        </div>

    </section>

    <footer>
        Built for smarter civic services.
    </footer>

</body>

</html>
