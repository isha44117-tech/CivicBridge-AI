<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue | CivicBridge AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            padding: 25px 8%;
            background: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 22px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <script src="/static/script.js" defer></script>

</head>

<body>

    <header>
        <div class="logo">CivicBridge AI</div>
    </header>

    <div class="container">

        <div class="card">

            <h1>Report a Civic Issue</h1>

            <p>
                Tell us what is happening. CivicBridge AI will analyze
                your complaint and help organize it.
            </p>

            <label for="description">Describe the issue</label>

            <textarea
                id="description"
                placeholder="Example: There is a large amount of garbage near Sector 22 market...">
            </textarea>

            <label for="location">Location / Sector</label>

            <input
                type="text"
                id="location"
                placeholder="Example: Sector 22, Chandigarh">

            <label for="category">Category (optional)</label>

            <select id="category">

                <option value="">Let AI detect it</option>
                <option value="Waste">Waste Management</option>
                <option value="Road">Road / Pothole</option>
                <option value="Streetlight">Streetlight</option>
                <option value="Water">Water / Leakage</option>
                <option value="Traffic">Traffic Signal</option>

            </select>

            <button>Analyze with AI</button>
            <div id="result" style="display: none;">
    <h2>AI Analysis</h2>

    <p><strong>Issue:</strong> <span id="resultCategory"></span></p>
    <p><strong>Priority:</strong> <span id="resultPriority"></span></p>
    <p><strong>Summary:</strong> <span id="resultSummary"></span></p>
    <p><strong>Suggested Authority:</strong> <span id="resultAuthority"></span></p>
</div>

        </div>

    </div>

</body>

</html>
